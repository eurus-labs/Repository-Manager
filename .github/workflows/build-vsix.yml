name: Build VSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload a VSIX to (leave blank for CI only)
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: npm test

      - name: Install Chromium for UI snapshots
        run: npx playwright-core install --with-deps chromium

      - name: UI snapshots
        run: node ./src/test/uiSnapshots.js

      - name: Requirement editor UI
        run: node ./src/test/requirementEditorUi.js

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ui-snapshots/
          if-no-files-found: ignore

      - name: Verify VSIX packaging
        run: npm run package

  upload-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      # Earlier release tags have a test that expects a named local branch.
      - name: Provide local branch for tagged builds
        run: git switch -c release-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: npm test

      # The release tag is the version of record. A release published before the version
      # bump was merged (as happened for 1.5.0) used to fail here and ship no VSIX; now the
      # tag's version is stamped into the build. A tag older than package.json is still
      # refused, since that means the release points at the wrong commit.
      - name: Use the release tag as the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag $RELEASE_TAG is not a version like 1.5.0 or v1.5.0"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            newest=$(printf '%s\n%s\n' "$version" "$tag" | sort -V | tail -n 1)
            if [ "$newest" != "$tag" ]; then
              echo "::error::Release tag $RELEASE_TAG is older than package.json version $version; the tag probably points at the wrong commit"
              exit 1
            fi
            echo "::warning::package.json at $RELEASE_TAG says $version; packaging it as $tag. Bump package.json before publishing to avoid this."
            npm version "$tag" --no-git-tag-version --allow-same-version > /dev/null
          fi
          echo "Packaging version $(node -p "require('./package.json').version")"

      - name: Package VSIX
        run: npm run package

      - name: Upload matching VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          asset="repository-manager-$version.vsix"
          if [ ! -f "$asset" ]; then
            echo "::error::Built VSIX $asset is missing"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber
